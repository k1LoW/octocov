name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEBUG: 1
    steps:
      - name: Show rate limit
        run: |
          curl -sL -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/rate_limit

      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run lint
        uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2 # v2.10.0
        with:
          go_version_file: go.mod
          cache: false
          fail_level: warning

      - name: Run gostyle
        uses: k1LoW/gostyle-action@e1b847d37b3041c5fdb8b911bcf00b350779ca61 # v1.5.1
        with:
          config-file: .gostyle.yml
          fail-on-error: true
        env:
          GOTOOLCHAIN: auto

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ''
          go-version-file: go.mod
          repo-checkout: false
          go-package: ./...

      - name: Run tests
        run: make ci

      - name: Check that the page bundle is the one its sources build
        run: |
          # make ci builds the binary with make build, which rebuilds the page bundle from
          # internal/page/bundle/package-lock.json first. A committed bundle that differs from
          # it is one somebody forgot to rebuild after changing the package it comes from.
          git diff --exit-code -- internal/page _EXTRA_CREDITS

      - name: Run test_central
        if: ${{ github.event_name == 'pull_request' }}
        run: make test_central

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'fs'

      # Each custom metrics step writes one JSON into .tmp/custom_metrics/, and the
      # combine step below merges them into one array, so adding a metric only means
      # adding a step here, not another OCTOCOV_CUSTOM_METRICS_* on every octocov run.
      - name: Measure build size
        run: |
          mkdir -p .tmp/custom_metrics
          # -s -w matches the release build, since the size that matters is the downloaded asset.
          go build -ldflags="-s -w" -o .tmp/octocov .
          size=$(wc -c < .tmp/octocov)
          gzipped=$(gzip -9 -c .tmp/octocov | wc -c)
          jq -n \
            --arg goos "$(go env GOOS)" --arg goarch "$(go env GOARCH)" \
            --argjson size "$size" --argjson gzipped "$gzipped" '{
            key: "build_size",
            name: "Build size",
            metadata: [
              { key: "goos", name: "GOOS", value: $goos },
              { key: "goarch", name: "GOARCH", value: $goarch }
            ],
            metrics: [
              { key: "binary", name: "Stripped binary", value: (($size / 1024) | round), unit: " KB" },
              { key: "gzipped", name: "Gzipped", value: (($gzipped / 1024) | round), unit: " KB" }
            ]
          }' > .tmp/custom_metrics/build_size.json

      - name: Combine custom metrics
        run: jq -s . .tmp/custom_metrics/*.json > .tmp/custom_metrics.json

      - name: Build octocov and run as a action
        uses: ./testdata/actions/coverage
        env:
          MACKEREL_API_KEY: ${{ secrets.MACKEREL_API_KEY }}
          OCTOCOV_CUSTOM_METRICS_BENCHMARK_1: ./testdata/custom_metrics/benchmark_1.json
          OCTOCOV_CUSTOM_METRICS_BENCHMARK_0: ./testdata/custom_metrics/benchmark_0.json
          OCTOCOV_CUSTOM_METRICS_CI: ./.tmp/custom_metrics.json
          GOTOOLCHAIN: 'go${{ steps.setup-go.outputs.go-version }}'

      # Storing the report twice in one run makes octocov delete the artifact it wrote
      # first, which needs the actions write permission. A fork's token is read-only, so
      # this check only runs where that write is available, which is where it has always
      # run, since a pull request stored nothing at all while report.if held it back.
      - name: 'RE: Build octocov and run as a action' # for checking re-upload artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: ./testdata/actions/coverage
        env:
          MACKEREL_API_KEY: ${{ secrets.MACKEREL_API_KEY }}
          OCTOCOV_CUSTOM_METRICS_BENCHMARK_1: ./testdata/custom_metrics/benchmark_1.json
          OCTOCOV_CUSTOM_METRICS_BENCHMARK_0: ./testdata/custom_metrics/benchmark_0.json
          OCTOCOV_CUSTOM_METRICS_CI: ./.tmp/custom_metrics.json
          GOTOOLCHAIN: 'go${{ steps.setup-go.outputs.go-version }}'

      # Uploading the page needs ACTIONS_RUNTIME_TOKEN, which a run step is not given, so the
      # binary built above runs in a container step. golang:latest is the image the action
      # above is built from, so it is already pulled, and it has the CA certificates.
      - name: Run octocov with viewer artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker://golang:latest
        with:
          entrypoint: /github/workspace/.tmp/octocov
          args: --config testdata/octocov_artifact_viewer.yml

      - name: Show rate limit
        run: |
          curl -sL -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/rate_limit

  test-windows:
    name: Test for Windows
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEBUG: 1
    steps:
      - name: Use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run tests
        run: make ci

      - name: Run test_central
        if: ${{ github.event_name == 'pull_request' }}
        run: make test_central
